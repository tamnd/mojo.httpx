# The TLS origin the tunnelling cases reach through a proxy. See proxy.mojo.
#
# The same origin as everything else with TLS in front of it, so a body that
# came back through a tunnel can be compared with the same body fetched
# straight through a forwarding proxy. It is a separate container rather than
# TLS added to the origin itself, because the origin is a Python http.server
# and giving it TLS would mean the suite depended on that rather than on
# something built for it.
#
# The certificate is the suite's own, signed by the CA in .proxycerts, which is
# the point of the tunnelling cases: the certificate that comes back through a
# tunnel has to be the origin's own and not the proxy's.

events {}

http {
    access_log off;

    upstream origin {
        server origin:8080;
        keepalive 8;
    }

    server {
        listen 443 ssl;
        server_name tlsorigin;

        ssl_certificate /certs/server.pem;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Off, or nginx holds a body with no length until it has all of
            # it, and what reaches the tunnel is a buffer rather than the
            # stream the origin sent.
            proxy_buffering off;
        }
    }
}
