# tinyproxy for the proxy interop suite. See tools/interop/proxy.mojo.
#
# The opposite end of the range from Squid. tinyproxy is a few thousand lines
# that forward and tunnel and do nothing else, which is what makes it worth
# testing against: it has none of Squid's tolerance for a request that is not
# quite right.

Port 8888
Listen 0.0.0.0
Timeout 600

User nobody
Group nogroup

# Open for the same reason Squid is. Nothing but the loopback address on the
# machine running the suite can reach this.
Allow 0.0.0.0/0

# tinyproxy tunnels to nothing at all unless a port is named here, and 443 is
# the only one the suite asks for.
ConnectPort 443

LogLevel Critical
PidFile "/tmp/tinyproxy.pid"
