# Dante for the proxy interop suite, no authentication. See proxy.mojo.
#
# Dante is the SOCKS5 server the specification's own authors point at and the
# one most people mean by a SOCKS proxy. It is not HTTP and it never reads the
# request, so what it tests is the handshake in RFC 1928 and nothing above it.

logoutput: stderr
internal: 0.0.0.0 port = 1080
external: eth0

socksmethod: none

user.privileged: root
user.notprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}

# The method has to be named in the rule as well as at the top of the file.
# Dante will not match a rule that says nothing about the method against a
# session that negotiated `none`, and what that looks like from the client is
# the proxy accepting the connection, agreeing on a method, and then closing
# without answering the request at all.
socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    socksmethod: none
}
