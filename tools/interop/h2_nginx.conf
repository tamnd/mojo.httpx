# nginx as an HTTP/2 front end for the interop suite. See tools/interop/h2.mojo.
#
# `http2 on` is the 1.25.1 spelling. The older `listen ... http2` still parses
# and warns, and pinning the image tag is what keeps this from mattering.

events {}

http {
    access_log off;

    upstream origin {
        server origin:8080;
        keepalive 8;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate /certs/server.pem;
        ssl_certificate_key /certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # nginx sends the upstream name as the Host by default, which would
            # throw away the :authority the client sent and make the case that
            # checks for it pass on a client that never sent one. The other
            # three front ends preserve it without being asked.
            proxy_set_header Host $host;
            # Off, or nginx holds a streamed body until it has all of it and
            # the drip case arrives in one piece, which is the one thing that
            # case exists to rule out.
            proxy_buffering off;
        }
    }
}
