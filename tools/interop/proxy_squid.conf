# Squid for the proxy interop suite. See tools/interop/proxy.mojo.
#
# Nothing here is a production configuration and it should not be read as one.
# It is the smallest squid that forwards and tunnels on a private network, plus
# one rule that exists to be hit.

http_port 3128

acl everyone src all

# The rule that exists to be hit, and it has to come first, because squid takes
# the first http_access line that matches and an allow above it would answer
# every CONNECT before this was ever read. Squid's own default refuses CONNECT
# to anything but a small set of ports, and the suite has a case that asks for a
# tunnel to the plain origin on 8080 and expects to be told no. A proxy that
# refuses is a case worth having, because the client has to turn that refusal
# into an error naming the status rather than into a response nobody can read.
acl tunnel_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !tunnel_ports

# Otherwise open, because the only thing that can reach this port is the
# loopback address on the machine running the suite.
http_access allow everyone

# No cache at all. A cache would make the second request in a case answerable
# without the origin, and several cases are about what the origin saw.
cache deny everyone

# Squid writes its own files as the proxy user, and a container has nowhere
# useful to put them.
access_log none
cache_log /dev/null
pid_filename none
coredump_dir /tmp

# Long enough that the drip case is not cut off by the proxy itself.
read_timeout 2 minutes
