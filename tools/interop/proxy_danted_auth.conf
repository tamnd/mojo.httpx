# Dante again, on another port, wanting a username and a password. See
# proxy.mojo.
#
# RFC 1929 carries credentials as length prefixed bytes in the handshake rather
# than as a header, so this is the only place that code path can be exercised
# against something that did not come out of the same repository.
#
# The account is created in the image and the password is in the repository on
# purpose, for the same reason tinyproxy's is.

logoutput: stderr
internal: 0.0.0.0 port = 1081
external: eth0

socksmethod: username

user.privileged: root
user.notprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    socksmethod: username
}
