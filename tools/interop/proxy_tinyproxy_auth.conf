# tinyproxy again, on another port, wanting credentials. See proxy.mojo.
#
# A second container rather than a second port on the first one, because what
# is being tested is what happens with no credentials as well as what happens
# with them, and a listener that sometimes wants them cannot answer both.
#
# The password is in the repository on purpose. It guards a proxy that lives
# for the length of one run on the loopback address of the machine running it.

Port 8889
Listen 0.0.0.0
Timeout 600

User nobody
Group nogroup

Allow 0.0.0.0/0
ConnectPort 443

BasicAuth interop hunter2

LogLevel Critical
PidFile "/tmp/tinyproxy-auth.pid"
