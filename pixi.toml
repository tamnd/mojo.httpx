[workspace]
name = "mojo-httpx"
version = "0.0.1"
description = "A full featured HTTP client for Mojo, with the same API as httpx2"
authors = ["mojo.httpx contributors"]
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/tamnd/mojo.httpx"
repository = "https://github.com/tamnd/mojo.httpx"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo = "==1.0.0"

[feature.dev.dependencies]
openssl = ">=3.0"

# The nightly Mojo build. CI runs this as an early warning for language changes
# and is allowed to fail. Do not develop against it.
[feature.nightly]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]

[feature.nightly.dependencies]
mojo = "*"

# The parity suite runs the same scenarios through httpx2 and compares the bytes
# on the wire. Only needed for `pixi run -e parity parity`.
[feature.parity.dependencies]
python = ">=3.12"

[feature.parity.pypi-dependencies]
httpx2 = "*"

# The differential fuzzer needs the parser it is being compared against. h11 is
# the reference because it is what httpx itself parses with, so a disagreement
# is a real difference in behaviour and not a difference of opinion between two
# libraries nobody uses.
[feature.fuzz.dependencies]
python = ">=3.12"

[feature.fuzz.pypi-dependencies]
h11 = "*"

[environments]
default = { features = ["dev"] }
nightly = { features = ["nightly"], no-default-feature = true }
parity = { features = ["dev", "parity"] }
fuzz = { features = ["dev", "fuzz"] }

[tasks]
test = "python tools/mojotest/run.py"
format = "mojo format httpx/ tests/"
# `mojo format` has no --check flag, so CI formats and then asks git whether
# anything moved.
format-check = "python tools/fmt/check.py"

# The test corpora under tests/data/ are vendored, so this checks they are the
# bytes tests/data/LOCK.toml says they are and that nothing undeclared has been
# dropped in beside them. Fetching is a separate, deliberate step:
# `python tools/vendor/fetch.py --update`.
vendor-check = "python tools/vendor/check.py"

# Some vendored data is checked in twice: once as the file itself and once as
# the Mojo the generator makes of it. This is what catches the second drifting
# from the first, which would otherwise show up as a cookie scoping bug nobody
# is looking for, or as a conformance suite quietly testing last year's cases.
generated-check = "python tools/gen_psl.py --check && python tools/gen_cookie_cases.py --check && python tools/gen_url_cases.py --check && python tools/gen_idna.py --check && python tools/gen_idna_cases.py --check"

# Layering, unsafe operations and deadlines. See tools/lint/run.py for why each
# one exists.
lint = "python tools/lint/run.py"
lint-selftest = "python tools/lint/run.py --selftest"

# The response parser against h11, on generated and randomly damaged input.
# Needs its own environment for h11, so it is `pixi run -e fuzz fuzz`. Not part
# of `check`, because a fuzzer with a fixed seed and a fixed case count is a
# slow test, and one without them is not something a commit can wait for. CI
# runs it nightly with a fresh seed.
fuzz = "python tools/fuzz/h1_diff.py"

# The platform tables that cannot be checked from Mojo, because checking them
# means asking the host what the right answer is. Everything that can be
# checked from Mojo is a test instead, so that it runs on every platform on
# every run. See tests/unit/test_abi.mojo.
baseline = "python tools/baseline/check_errno.py"

# Everything, in the order a failure is cheapest to read.
check = { depends-on = [
  "format-check",
  "lint",
  "lint-selftest",
  "vendor-check",
  "generated-check",
  "baseline",
  "test",
] }

# Tasks below land with the milestone that needs them. See docs/roadmap.md.
#   build         M8   mojo build httpx/cli/__main__.mojo -o build/httpx
#   bench         M2   the benchmark suite
#   parity        M4   the httpx2 comparison suite
#   docs          M8   render the mojo doc JSON into the API reference
