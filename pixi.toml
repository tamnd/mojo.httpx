[workspace]
name = "mojo-httpx"
version = "0.0.1"
description = "A full featured HTTP client for Mojo, with the same API as httpx2"
authors = ["mojo.httpx contributors"]
license = "Apache-2.0"
license-file = "LICENSE"
readme = "README.md"
homepage = "https://github.com/tamnd/mojo.httpx"
repository = "https://github.com/tamnd/mojo.httpx"
channels = ["https://conda.modular.com/max", "conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo = "==1.0.0"

[feature.dev.dependencies]
openssl = ">=3.0"

# The content codings, from both ends. `libbrotlidec` and `zstd` carry the two
# shared libraries the client opens at run time, and `brotli-python` and
# `zstandard` are what the test server compresses those two codings with. All
# four are named rather than left to the machine, because otherwise which
# codings work would depend on what each host happens to have installed and
# `Accept-Encoding` would say something different on every one of them. zstd is
# in the environment anyway, since conda's own package format uses it, but a
# dependency that is only there by accident is one a later solve can take away.
# `zstandard` is only needed because the environment solves to Python 3.12 on
# some platforms, and the standard library grew a zstd module in 3.14; the
# server prefers the standard library one where it exists.
brotli-python = "*"
libbrotlidec = "*"
zstandard = "*"
zstd = "*"

# The nightly Mojo build. CI runs this as an early warning for language changes
# and is allowed to fail. Do not develop against it.
[feature.nightly]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]

[feature.nightly.dependencies]
mojo = "*"

# The parity suite runs the same scenarios through httpx2 and compares the bytes
# on the wire. Only needed for `pixi run -e parity parity`.
[feature.parity.dependencies]
python = ">=3.12"

[feature.parity.pypi-dependencies]
httpx2 = "*"

# The differential fuzzers need the parsers they are being compared against.
# h11 is the reference for HTTP/1.1 because it is what httpx itself parses
# with, so a disagreement is a real difference in behaviour and not a
# difference of opinion between two libraries nobody uses. hpack is the
# reference for HPACK for the same reason: it is the HPACK half of the h2
# project, which is what httpx speaks HTTP/2 through, so the same argument
# carries over.
[feature.fuzz.dependencies]
python = ">=3.12"

[feature.fuzz.pypi-dependencies]
h11 = "*"
hpack = "*"

[environments]
default = { features = ["dev"] }
nightly = { features = ["nightly"], no-default-feature = true }
parity = { features = ["dev", "parity"] }
fuzz = { features = ["dev", "fuzz"] }

[tasks]
test = "python tools/mojotest/run.py"
format = "mojo format httpx/ tests/"
# `mojo format` has no --check flag, so CI formats and then asks git whether
# anything moved.
format-check = "python tools/fmt/check.py"

# The test corpora under tests/data/ are vendored, so this checks they are the
# bytes tests/data/LOCK.toml says they are and that nothing undeclared has been
# dropped in beside them. Fetching is a separate, deliberate step:
# `python tools/vendor/fetch.py --update`.
vendor-check = "python tools/vendor/check.py"

# Some vendored data is checked in twice: once as the file itself and once as
# the Mojo the generator makes of it. This is what catches the second drifting
# from the first, which would otherwise show up as a cookie scoping bug nobody
# is looking for, or as a conformance suite quietly testing last year's cases.
# The Huffman generator has no vendored source, because the table is printed in
# RFC 7541 and lives in the generator, but it checks the same way: it rebuilds
# the tables and compares them against what is on disk.
generated-check = "python tools/gen_psl.py --check && python tools/gen_cookie_cases.py --check && python tools/gen_url_cases.py --check && python tools/gen_idna.py --check && python tools/gen_idna_cases.py --check && python tools/gen_huffman.py --check"

# Layering, unsafe operations and deadlines. See tools/lint/run.py for why each
# one exists.
lint = "python tools/lint/run.py"
lint-selftest = "python tools/lint/run.py --selftest"

# The `httpx` command, built into build/. Not part of `check`, because the
# tests drive the CLI through `run(argv)` rather than through a process and so
# do not need a binary to exist. This is for trying it by hand. It cannot be
# built into the working directory, because the package is a directory called
# httpx and the linker will not write over it.
cli = "mkdir -p build && mojo build -I . -o build/httpx httpx/cli/main.mojo"

# The badssl.com matrix, one host per way of getting TLS wrong. Needs the
# network and depends on certificates somebody else renews, so it is not part
# of `check` and not in CI either. It runs on the fleet. See docs/testing.md.
badssl = "mojo run -I . tools/interop/badssl.mojo"

# HTTP/2 against nginx, Caddy, Envoy and nghttpx, all four in Docker on the
# loopback address. Not part of `check` and not in CI: it needs Docker, it
# pulls four images and it takes a couple of minutes. It runs on the fleet.
# See docs/testing.md.
interop-h2 = "bash tools/interop/h2_run.sh"

# Proxying against Squid, tinyproxy, mitmproxy and Dante, in Docker on the
# loopback address, forwarding and tunnelling and SOCKS5 and two kinds of proxy
# credentials. Not part of `check` and not in CI, for the same reasons as the
# suite above. It runs on the fleet. See docs/testing.md.
interop-proxy = "bash tools/interop/proxy_run.sh"

# What Mojo's async actually does on the toolchain we pin, measured rather than
# assumed. The evidence behind the M6 decision, kept runnable so that a
# toolchain which changes one of the answers shows up here. See docs/async.md.
probe-async = "mojo run -I . tools/probe/async.mojo"

# The response parser against h11, on generated and randomly damaged input.
# Needs its own environment for h11, so it is `pixi run -e fuzz fuzz`. Not part
# of `check`, because a fuzzer with a fixed seed and a fixed case count is a
# slow test, and one without them is not something a commit can wait for. CI
# runs it nightly with a fresh seed.
fuzz = "python tools/fuzz/h1_diff.py"

# The HPACK decoder against hpack, on encoded and randomly damaged header
# blocks. Same environment and the same reasons for not being in `check`. A
# case here is a run of blocks rather than one, because the dynamic table
# outlives a block and a decoder that gets the table wrong is right about every
# block taken on its own.
fuzz-hpack = "python tools/fuzz/hpack_diff.py"

# The same scenarios through this client and through httpx2, comparing the bytes
# that went out and what each one made of the answer. Needs httpx2 installed, so
# it is `pixi run -e parity parity`. Not part of `check` and not in CI, for the
# same reason the fuzzer is not: a second HTTP client and real sockets are a
# deliberate step rather than something every commit waits for. Add `--show-all`
# to see the differences that are being accepted rather than only the ones that
# fail. See docs/testing.md.
parity = "python tools/parity/run.py"

# The platform tables that cannot be checked from Mojo, because checking them
# means asking the host what the right answer is. Everything that can be
# checked from Mojo is a test instead, so that it runs on every platform on
# every run. See tests/unit/test_abi.mojo.
baseline = "python tools/baseline/check_errno.py"

# Everything, in the order a failure is cheapest to read.
check = { depends-on = [
  "format-check",
  "lint",
  "lint-selftest",
  "vendor-check",
  "generated-check",
  "baseline",
  "test",
] }

# Tasks below land with the milestone that needs them. See docs/roadmap.md.
#   build         M8   mojo build httpx/cli/__main__.mojo -o build/httpx
#   bench         M2   the benchmark suite
#   docs          M8   render the mojo doc JSON into the API reference
