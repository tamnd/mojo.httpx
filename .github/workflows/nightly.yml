name: Nightly toolchain

# Mojo is still changing between releases in ways that break real code, so we
# build against the nightly toolchain every day. This job is allowed to fail.
# It exists to give us warning before a stable release lands, not to gate work.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build:
    name: nightly ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: true
    outputs:
      failed: ${{ steps.result.outputs.failed }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          environments: nightly
          locked: false
          cache: false
      - name: Record the toolchain
        run: pixi run -e nightly mojo --version
      - name: Test
        id: run
        run: pixi run -e nightly mojo run -I . tests/run.mojo 2>&1 | tee nightly-${{ matrix.name }}.log
      - name: Note the result
        id: result
        if: always()
        run: echo "failed=${{ steps.run.outcome == 'failure' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-log-${{ matrix.name }}
          path: nightly-${{ matrix.name }}.log
          retention-days: 14

  report:
    name: open an issue on breakage
    runs-on: ubuntu-24.04
    needs: build
    if: always() && needs.build.outputs.failed == 'true'
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - name: Write the issue body
        run: |
          {
            echo "The nightly Mojo toolchain broke the build."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "This does not block anything on main, but it means a language change"
            echo "is coming that this project needs to handle. Check the logs on the run,"
            echo "then re-run the toolchain probes to see which assumption moved."
          } > issue.md
      - uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          title: "Nightly Mojo build is failing"
          content-filepath: issue.md
          labels: toolchain, ci
