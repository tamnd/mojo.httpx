name: Differential fuzz

# The HTTP/1.1 parser against h11 and the HPACK decoder against hpack, on a
# fresh seed every night. This is the one suite where a green run today says
# nothing about tomorrow, because the value is in the cases nobody has generated
# yet. It is out of the pull request path on purpose: a run long enough to find
# anything takes longer than a commit should wait, and a run short enough to
# gate on would only ever re-find what the last one already fixed.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      cases:
        description: How many cases to generate
        required: false
        default: "200000"
      seed:
        description: The seed to use, or empty for the run number
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      # One fuzzer finding something says nothing about the other, and the
      # night is worth more with both answers than with the first one.
      fail-fast: false
      matrix:
        include:
          - name: parser against h11
            task: fuzz
            log: fuzz-h1.log
          - name: HPACK decoder against hpack
            task: fuzz-hpack
            log: fuzz-hpack.log
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@194d461b21b6c5717c722ffc597fa91ed2ff29fa # v0.9.1
        with:
          pixi-version: v0.78.0
          environments: fuzz
          locked: true
      - name: Run
        id: run
        env:
          CASES: ${{ inputs.cases || '200000' }}
          # The run number rather than the clock, so a failing night can be
          # reproduced exactly by dispatching the same seed by hand.
          SEED: ${{ inputs.seed || github.run_number }}
          TASK: ${{ matrix.task }}
          LOG: ${{ matrix.log }}
        run: |
          pixi run -e fuzz "$TASK" --cases "$CASES" --seed "$SEED" --show 20 2>&1 | tee "$LOG"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ matrix.log }}
          path: ${{ matrix.log }}
          retention-days: 30

  report:
    name: open an issue on a disagreement
    runs-on: ubuntu-24.04
    needs: fuzz
    if: failure()
    permissions:
      contents: read
      issues: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Write the issue body
        run: |
          {
            echo "A differential fuzzer found a case where this library and the reference"
            echo "implementation do not agree. The job name says which of the two it was."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "Seed: ${{ github.run_number }}"
            echo
            echo "The failing cases are printed in the log and in the uploaded artifact, in"
            echo "hex, in the form the matching harness reads. Reproduce one with the same"
            echo "seed, then turn it into a unit test before changing anything, because the"
            echo "fix belongs next to the rule it is about and not in the fuzzer."
            echo
            echo "Accepting something the reference rejects is the direction that matters."
            echo "Being stricter than the reference is expected and is not reported as a"
            echo "failure."
          } > issue.md
      - uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: "Differential fuzzer found a disagreement"
          content-filepath: issue.md
          # Quoted because the area label has a colon in it and YAML would take
          # that as the start of another key.
          labels: "security, area: testing"
