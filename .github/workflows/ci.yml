name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Least privilege by default. A job that needs more asks for it itself.
permissions:
  contents: read

# One run per ref. A new push cancels the old run, except on main where we want
# every commit on the branch to have a real result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PIXI_VERSION: v0.78.0

jobs:
  format:
    name: format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@194d461b21b6c5717c722ffc597fa91ed2ff29fa # v0.9.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - run: pixi run format-check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@194d461b21b6c5717c722ffc597fa91ed2ff29fa # v0.9.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - run: pixi run lint
      # A lint that has stopped matching anything reports success forever, so
      # the lints are themselves checked against known violations.
      - run: pixi run lint-selftest
      # docs/api.md is generated from the source and committed. This is what
      # catches a renamed argument that nobody re-rendered the page for.
      - run: pixi run docs-check

  docs:
    name: docs
    runs-on: ubuntu-24.04
    # Sixty odd whole programs, each one a full build of the package. It is a
    # job of its own rather than a step on lint because it takes about as long
    # as the test suite does, and it runs beside the suite rather than after it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@194d461b21b6c5717c722ffc597fa91ed2ff29fa # v0.9.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      # Every ```mojo block in the docs is a whole program, and this is what
      # makes that claim worth anything. It caught two names missing from the
      # public surface the day it was written, both of which made a documented
      # extension point impossible to use and neither of which was visible by
      # reading the code.
      - run: pixi run docex

  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # Almost all of this is compiling. The runner splits the suite into shards
    # of a few test modules each and builds one binary per shard, because the
    # cost of a Mojo build grows well above linearly in how much is in it. One
    # binary over the whole suite was thirty six minutes here against a forty
    # five minute cap; the same tests in thirteen shards are around twelve.
    # tools/mojotest/run.py has the measurements the split was chosen from.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@194d461b21b6c5717c722ffc597fa91ed2ff29fa # v0.9.1
        with:
          pixi-version: ${{ env.PIXI_VERSION }}
          environments: default
          locked: true
          cache: true
      - name: Record the toolchain
        run: pixi run mojo --version
      # The errno table is platform specific and this is the only place it can
      # be checked against the platform that will use it.
      - run: pixi run baseline
      - run: pixi run test
      # The CLI's own output, through a pipe and through a pty. It runs here
      # rather than in a job of its own because it needs the same toolchain and
      # takes under a minute next to the suite's twenty.
      - run: pixi run golden

  # The rest of the matrix in docs/roadmap.md joins as the code that needs it
  # lands: h1 and h2 from M5, OpenSSL 3.0 and 3.6 from M3, debug and release
  # builds from M2, and the interop suite against nginx, Caddy and Envoy.

  dependency-review:
    name: dependency review
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  # A single required check, so branch protection does not need updating every
  # time the matrix changes.
  ci-ok:
    name: ci ok
    runs-on: ubuntu-24.04
    needs: [format, lint, docs, test]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail if anything upstream failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\)"'; then
            echo "a required job did not pass"
            exit 1
          fi
          echo "all required jobs passed"
