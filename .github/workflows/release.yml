name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.78.0
          environments: default
          locked: true
          cache: true
      - run: pixi run test

  source:
    name: build the source tarball
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 15
    outputs:
      digest: ${{ steps.hash.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5.0.0
        with:
          persist-credentials: false
      # A .mojopkg is tied to the compiler that produced it and is not a
      # distributable format, so the release artifact is source. See
      # docs/architecture.md.
      - name: Archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="mojo-httpx-${version}/" \
            -o "mojo-httpx-${version}.tar.gz" HEAD
      - name: Checksum
        id: hash
        run: |
          sha256sum mojo-httpx-*.tar.gz | tee SHA256SUMS
          echo "digest=$(sha256sum mojo-httpx-*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: |
            mojo-httpx-*.tar.gz
            SHA256SUMS

  publish:
    name: publish
    runs-on: ubuntu-24.04
    needs: source
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: source
      - name: Attest the artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mojo-httpx-*.tar.gz
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v2.3.4
        with:
          generate_release_notes: true
          files: |
            mojo-httpx-*.tar.gz
            SHA256SUMS
